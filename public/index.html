<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Subway Arrivals</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0b0e1a;
      color: #e6edf3;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(180deg, #111827 0%, #0b0e1a 100%);
      border-bottom: 1px solid #1f2937;
      padding: 18px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6e7681;
      margin-bottom: 10px;
    }

    /* ── Station search ── */
    .search-wrap {
      position: relative;
      max-width: 560px;
      margin: 0 auto 10px;
    }

    .search-input {
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      font-size: 15px;
      padding: 10px 42px 10px 38px;
      outline: none;
      transition: border-color 0.2s;
    }

    .geo-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #6e7681;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }
    .geo-btn:hover { color: #e6edf3; }

    .search-input:focus { border-color: #58a6ff; }
    .search-input::placeholder { color: #484f58; }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #6e7681;
      font-size: 15px;
      pointer-events: none;
    }

    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }

    .dropdown.open { display: block; }

    .dropdown-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      color: #c9d1d9;
      border-bottom: 1px solid #21262d;
      transition: background 0.1s;
    }

    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover, .dropdown-item.active { background: #21262d; color: #e6edf3; }

    .dropdown-item mark {
      background: none;
      color: #58a6ff;
      font-weight: 700;
    }

    /* ── Selected station display ── */
    .station-display {
      text-align: center;
    }

    .station-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f0f6fc;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      font-size: 12px;
    }

    .pulse-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .updated-label { color: #58a6ff; }

    .error-banner {
      background: #3d1a1a;
      color: #f85149;
      text-align: center;
      padding: 8px 20px;
      font-size: 12px;
    }

    /* ── Service alerts ── */
    .alerts-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .alert-critical { background: rgba(248,81,73,.1);  border: 1px solid rgba(248,81,73,.3); }
    .alert-warning  { background: rgba(210,153,34,.1); border: 1px solid rgba(210,153,34,.3); }
    .alert-info     { background: rgba(88,166,255,.1); border: 1px solid rgba(88,166,255,.3); }

    .alert-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 1px;
    }

    .alert-critical .alert-badge { background: rgba(248,81,73,.25);  color: #f85149; }
    .alert-warning  .alert-badge { background: rgba(210,153,34,.25); color: #d29922; }
    .alert-info     .alert-badge { background: rgba(88,166,255,.25); color: #58a6ff; }

    .alert-text { color: #c9d1d9; }

    /* ── Train grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .loading {
      text-align: center;
      color: #6e7681;
      padding: 60px 20px;
      font-size: 15px;
      grid-column: 1/-1;
    }

    /* ── Line cards ── */
    .card {
      background: #161b22;
      border-radius: 14px;
      border: 1px solid #21262d;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px 11px;
      border-bottom: 1px solid #21262d;
    }

    .bullet {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }

    .card-title { font-size: 14px; font-weight: 600; color: #c9d1d9; }

    /* Destination sections inside a card */
    .card-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    }

    .dest-section { padding: 12px 16px 14px; }
    .dest-section:not(:last-child) { border-right: 1px solid #21262d; }

    .dest-label {
      font-size: 11px;
      font-weight: 700;
      color: #8b949e;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .times { display: flex; flex-direction: column; gap: 7px; }

    .time-row { display: flex; align-items: baseline; gap: 4px; }

    .mins {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    .unit { font-size: 12px; color: #6e7681; }

    .mins.now    { color: #3fb950; animation: arrive 1s ease-in-out infinite; }
    .mins.soon   { color: #3fb950; }
    .mins.coming { color: #d29922; }
    .mins.later  { color: #c9d1d9; }

    @keyframes arrive { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

    .no-trains { color: #3d444d; font-size: 13px; padding: 4px 0; }
  </style>
</head>
<body>

<header>
  <div class="header-top">NYC Subway · Real-Time Arrivals</div>

  <div class="search-wrap" id="searchWrap">
    <span class="search-icon">⌕</span>
    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="Search for a station…"
      autocomplete="off"
    >
    <button class="geo-btn" id="geoBtn" title="Find nearest station">📍</button>
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div class="station-display">
    <div class="station-name" id="stationName">Loading…</div>
    <div class="status-bar">
      <div class="pulse-dot"></div>
      <span class="updated-label" id="updated">Connecting…</span>
    </div>
  </div>
</header>

<div id="errorBanner" class="error-banner" style="display:none"></div>
<div id="alerts" class="alerts-section"></div>
<div id="grid" class="grid"><div class="loading">Loading arrivals…</div></div>

<script>
// ── MTA colors ──
const LINE_COLORS = {
  '1':'#EE352E','2':'#EE352E','3':'#EE352E',
  '4':'#00933C','5':'#00933C','6':'#00933C','7':'#B933AD',
  'A':'#0039A6','C':'#0039A6','E':'#0039A6',
  'B':'#FF6319','D':'#FF6319','F':'#FF6319','M':'#FF6319',
  'G':'#6CBE45',
  'J':'#996633','Z':'#996633',
  'L':'#A7A9AC',
  'N':'#FCCC0A','Q':'#FCCC0A','R':'#FCCC0A','W':'#FCCC0A',
  'GS':'#808183','FS':'#808183','H':'#808183','SI':'#0039A6',
  'LIRR':'#004B87',
};

// Lines needing dark text on their colored bullet
const DARK_TEXT = new Set(['N','Q','R','W','G','L']);

// Preferred display order; any unlisted line appended alphabetically
const LINE_ORDER = ['1','2','3','4','5','6','7','A','C','E','B','D','F','M','G','J','Z','L','N','Q','R','W','SI','LIRR'];

// ── State ──
let allStations = [];   // [{ name, stopIds, lat, lon }]
let currentStation = null;
let refreshTimer = null;

// ── Station persistence ──
function saveStation(station) {
  localStorage.setItem('subway_station', JSON.stringify(station));
}

function loadSavedStation() {
  try { return JSON.parse(localStorage.getItem('subway_station')); } catch { return null; }
}

// ── Render helpers ──
function minuteClass(m) {
  if (m === 0) return 'now';
  if (m <= 2)  return 'soon';
  if (m <= 5)  return 'coming';
  return 'later';
}

function renderTime(m) {
  if (m === 0) return `<div class="time-row"><span class="mins now">Now</span></div>`;
  return `<div class="time-row"><span class="mins ${minuteClass(m)}">${m}</span><span class="unit">min</span></div>`;
}

function destSection(headsign, trains) {
  const body = trains.length
    ? `<div class="times">${trains.slice(0,3).map(t => renderTime(t.minutes)).join('')}</div>`
    : `<div class="no-trains">No trains</div>`;
  return `<div class="dest-section"><div class="dest-label" title="${headsign}">${headsign}</div>${body}</div>`;
}

function renderCard(line, byHeadsign) {
  const color = LINE_COLORS[line] || '#808183';
  const textColor = DARK_TEXT.has(line) ? '#000' : '#fff';
  const title = line === 'LIRR' ? 'Long Island Rail Road' : `${line} Train`;

  // Sort destinations: most arrivals first, then alphabetically
  const destinations = Object.keys(byHeadsign).sort(
    (a, b) => byHeadsign[b].length - byHeadsign[a].length || a.localeCompare(b)
  );

  const sectionsHtml = destinations.map(h => destSection(h, byHeadsign[h])).join('');

  return `
    <div class="card">
      <div class="card-header">
        <div class="bullet" style="background:${color};color:${textColor}">${line}</div>
        <div class="card-title">${title}</div>
      </div>
      <div class="card-body">${sectionsHtml}</div>
    </div>`;
}

function renderAlerts(alerts) {
  const el = document.getElementById('alerts');
  if (!alerts?.length) { el.innerHTML = ''; return; }
  el.innerHTML = alerts.map(a =>
    `<div class="alert-item alert-${a.severity}">
      <span class="alert-badge">${a.effectLabel}</span>
      <span class="alert-text">${a.header}</span>
    </div>`
  ).join('');
}

function render(data) {
  // Group arrivals by line → headsign
  const byLine = {};
  for (const a of data.arrivals) {
    if (!byLine[a.line]) byLine[a.line] = {};
    if (!byLine[a.line][a.headsign]) byLine[a.line][a.headsign] = [];
    byLine[a.line][a.headsign].push(a);
  }

  const presentLines = Object.keys(byLine);
  const ordered = [
    ...LINE_ORDER.filter(l => presentLines.includes(l)),
    ...presentLines.filter(l => !LINE_ORDER.includes(l)).sort(),
  ];

  const html = ordered.length
    ? ordered.map(l => renderCard(l, byLine[l])).join('')
    : `<div class="loading">No trains found for this station.</div>`;

  document.getElementById('grid').innerHTML = html;
  document.getElementById('updated').textContent =
    `Updated ${new Date(data.updated).toLocaleTimeString()}`;

  renderAlerts(data.alerts);

  const banner = document.getElementById('errorBanner');
  if (data.feedErrors?.length) {
    banner.style.display = 'block';
    banner.textContent = 'Feed errors: ' + data.feedErrors.join(' · ');
  } else {
    banner.style.display = 'none';
  }
}

// ── Arrivals fetch ──
async function fetchArrivals(station) {
  const stopIds = station.stopIds.join(',');
  const res = await fetch(`/api/arrivals?stopIds=${encodeURIComponent(stopIds)}`);
  if (!res.ok) throw new Error(`Server error ${res.status}`);
  return res.json();
}

async function refresh() {
  if (!currentStation) return;
  try {
    render(await fetchArrivals(currentStation));
  } catch (err) {
    document.getElementById('updated').textContent = `Error: ${err.message}`;
  }
}

function selectStation(station) {
  if (currentStation?.name === station.name) return;
  currentStation = station;
  saveStation(station);

  // Update URL so the page is shareable
  const url = new URL(window.location);
  url.searchParams.set('station', station.name);
  history.replaceState({}, '', url);

  document.getElementById('stationName').textContent = station.name;
  document.title = `${station.name} — Arrivals`;
  document.getElementById('grid').innerHTML = `<div class="loading">Loading arrivals…</div>`;
  document.getElementById('alerts').innerHTML = '';

  clearInterval(refreshTimer);
  refresh();
  refreshTimer = setInterval(refresh, 30_000);
}

// ── Station search autocomplete ──
async function initStations() {
  try {
    allStations = await fetch('/api/stations').then(r => r.json());
  } catch (err) {
    console.warn('Could not load stations:', err.message);
  }

  // Priority: URL param → localStorage → default
  const urlParam = new URLSearchParams(location.search).get('station');
  const saved    = loadSavedStation();

  const defaultStation =
    (urlParam && allStations.find(s => s.name === urlParam)) ||
    (saved    && allStations.find(s => s.name === saved.name)) ||
    allStations.find(s => s.name === 'Atlantic Av-Barclays Ctr') ||
    allStations[0];

  if (defaultStation) selectStation(defaultStation);
}

// ── Geolocation ──
document.getElementById('geoBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  const btn = document.getElementById('geoBtn');
  btn.textContent = '⏳';
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.textContent = '📍';
      const { latitude: lat, longitude: lon } = pos.coords;
      let nearest = null, minDist = Infinity;
      for (const s of allStations) {
        const d = (s.lat - lat) ** 2 + (s.lon - lon) ** 2;
        if (d < minDist) { minDist = d; nearest = s; }
      }
      if (nearest) selectStation(nearest);
    },
    () => { btn.textContent = '📍'; }
  );
});

const searchInput = document.getElementById('searchInput');
const dropdown   = document.getElementById('dropdown');
let activeIdx = -1;

function highlight(text, query) {
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + `<mark>${text.slice(idx, idx + query.length)}</mark>` + text.slice(idx + query.length);
}

function showDropdown(query) {
  if (!query) { closeDropdown(); return; }

  const q = query.toLowerCase();
  const matches = allStations
    .filter(s => s.name.toLowerCase().includes(q))
    .slice(0, 8);

  if (!matches.length) { closeDropdown(); return; }

  activeIdx = -1;
  dropdown.innerHTML = matches.map((s, i) =>
    `<div class="dropdown-item" data-idx="${i}">${highlight(s.name, query)}</div>`
  ).join('');
  dropdown.dataset.matches = JSON.stringify(matches.map(s => s.name));
  dropdown.classList.add('open');

  dropdown.querySelectorAll('.dropdown-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      const station = matches[+el.dataset.idx];
      pickStation(station);
    });
  });
}

function closeDropdown() {
  dropdown.classList.remove('open');
  dropdown.innerHTML = '';
  activeIdx = -1;
}

function pickStation(station) {
  searchInput.value = '';
  closeDropdown();
  selectStation(station);
}

function setActiveItem(idx, items) {
  items.forEach((el, i) => el.classList.toggle('active', i === idx));
}

searchInput.addEventListener('input', () => showDropdown(searchInput.value.trim()));

searchInput.addEventListener('keydown', e => {
  const items = [...dropdown.querySelectorAll('.dropdown-item')];
  if (!items.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, items.length - 1);
    setActiveItem(activeIdx, items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    setActiveItem(activeIdx, items);
  } else if (e.key === 'Enter' && activeIdx >= 0) {
    e.preventDefault();
    const names = JSON.parse(dropdown.dataset.matches || '[]');
    const station = allStations.find(s => s.name === names[activeIdx]);
    if (station) pickStation(station);
  } else if (e.key === 'Escape') {
    closeDropdown();
    searchInput.blur();
  }
});

document.addEventListener('click', e => {
  if (!document.getElementById('searchWrap').contains(e.target)) closeDropdown();
});

// ── Boot ──
initStations();
</script>
</body>
</html>
